name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # macOS runs here, nightly and by hand (Actions > CI > Run workflow), not on
  # PRs or main: GitHub's hosted macOS pool is short on capacity, and a job
  # that never gets a runner fails the required `ci` gate.
  schedule:
    - cron: '27 7 * * *'

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A release PR (only versions, CHANGELOG.md, revs and locks change; see
  # tools/release_only.py in magmalake/.github) skips the macOS, nightly and
  # extra jobs below and runs a consumer build of the PR head instead. Every
  # other PR runs everything. The verdict is its own fast job because the jobs
  # below wait for it; the builds are the next one.
  release:
    if: github.event_name == 'pull_request'
    uses: magmalake/.github/.github/workflows/release-check.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      classify-only: true

  release-check:
    needs: release
    if: needs.release.outputs.release_only == 'true'
    uses: magmalake/.github/.github/workflows/release-check.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      # The test legs below are skipped on release PRs, and the consumer build
      # is the check (the tests need the Rust toolchain and uv, which the shared job does not set up).
      task: ""


  # The Rust shim's own end-to-end test of the C ABI. Fast, and it fails first
  # when iceberg-rust changes an API under us.
  ffi:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_only != 'true' }}
    name: ffi / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ffi
      - name: cargo test
        run: cargo test --release --manifest-path ffi/Cargo.toml

  # The Mojo binding: round-trip gate plus the PyIceberg cross-check.
  test:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_only != 'true' }}
    name: ${{ matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Nightly is nice-to-have: the Modular nightly regularly moves stdlib APIs,
    # and this repo's contract is that it compiles on stable 1.2.0.
    continue-on-error: ${{ matrix.env == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        env: [default, nightly]
    steps:
      - uses: actions/checkout@v4

      # pixi builds the shim inside a rattler-build sandbox with the conda
      # `rust` package, but a host toolchain keeps `cargo` available for local
      # iteration and warms the same registry.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ffi

      # The PyIceberg cross-check builds its venv with uv.
      - uses: astral-sh/setup-uv@v5

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: ${{ matrix.env }}

      - name: Round-trip gate
        run: pixi run -e ${{ matrix.env }} test

      - name: Lint (mojolint --lsp)
        run: pixi run -e ${{ matrix.env }} lint

      - name: PyIceberg cross-check
        run: pixi run -e ${{ matrix.env }} pyiceberg

  # The one check to require: every job above passed or, on a release-only PR,
  # was skipped in favour of the release job's consumer build.
  ci:
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [release, release-check, ffi, test]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          release = needs.pop("release")
          build = needs.pop("release-check", {"result": "skipped"})
          release_only = release["outputs"].get("release_only") == "true"
          ok = {"success", "skipped"} if release_only else {"success"}
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ok}
          for k, v in (("release", release), ("release-check", build)):
              if v["result"] not in ("success", "skipped"):
                  bad[k] = v["result"]
          print("release-only:", release_only, "results:", {k: v["result"] for k, v in needs.items()})
          if bad:
              sys.exit(f"did not succeed: {bad}")
          PY
